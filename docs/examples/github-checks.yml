name: Application checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.lock
      - run: pip install -r requirements.lock
      - run: python manage.py test --settings=config.test_settings --noinput
      - run: python manage.py makemigrations --check --dry-run --settings=config.test_settings
      - run: python -m compileall -q analytics website config scripts
      - run: bash -n scripts/provision.sh scripts/finalize.sh
